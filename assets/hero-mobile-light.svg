    <clipPath id="panel"><rect x="1" y="1" width="598" height="378" rx="8"/></clipPath>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F6F8FA"/><stop offset="1" stop-color="#EDF3F9"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#panel)">
