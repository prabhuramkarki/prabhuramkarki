    <rect x="380" width="600" height="380" fill="url(#grid)" opacity=".65"/>
    <g transform="translate(520 191)" stroke="#ABC5DF" stroke-width=".8" opacity=".5">
      <use href="#contour" transform="scale(0.34)"/>
      <use href="#contour" transform="scale(0.52)"/>
      <use href="#contour" transform="scale(0.7)"/>
      <use href="#contour" transform="scale(0.88)"/>
      <use href="#contour" transform="scale(1.06)"/>
      <use href="#contour" transform="scale(1.24)"/>
      <use href="#contour" transform="scale(1.42)"/>
      <use href="#contour" transform="scale(1.6)"/>
    </g>
    <path d="M0 0V380" stroke="#0969DA" stroke-width="6"/>
  </g>
  <g font-family="'Segoe UI', Arial, sans-serif">
  <text x="32" y="47" fill="#52657A" font-size="22">Full-stack software engineer</text>
  <g fill="#162638" font-size="72" font-weight="700" letter-spacing="-3">
    <text x="28" y="137">Prabhuram</text>
    <text x="28" y="213">Karki</text>
  </g>
  <text x="32" y="270" fill="#0969DA" font-size="28">From the interface down.</text>
