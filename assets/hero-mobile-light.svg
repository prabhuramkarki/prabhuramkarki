<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Prabhuram Karki — Full-stack software engineer</title>
  <desc id="desc">From the interface down. Based in Kathmandu, Nepal. Abstract contour lines meet an interface, API, and data diagram.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#CDDAE7" stroke-width=".6"/>
    </pattern>
