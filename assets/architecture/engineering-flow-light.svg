<title id="title">Illustrative full-stack system map</title><desc id="desc">Components and state connect to application APIs, rules and authorization, then queues, cache and databases. Linux, containers and CI/CD support all layers. Conceptual architecture, not a deployed system or live telemetry.</desc>
