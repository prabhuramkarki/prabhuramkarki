<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
<title id="title">Illustrative full-stack architecture</title><desc id="desc">Interface, application logic, and work and data have explicit boundaries. Delivery supports all layers. This is a conceptual pattern, not every project’s architecture.</desc>
<rect x="0.5" y="0.5" width="959" height="329" rx="12" fill="#0D1117" stroke="#303D4D"/>
<text x="32" y="43" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="700" fill="#E6EDF3" text-anchor="start">One feature. Clear boundaries.</text>
<text x="32" y="72" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#A0ADBC" text-anchor="start">An illustrative architecture</text>
<rect x="32" y="104" width="276" height="124" rx="10" fill="#161B22" stroke="#303D4D"/>
<text x="50" y="132" font-family="'Segoe UI', Arial, sans-serif" font-size="23" font-weight="600" fill="#E6EDF3" text-anchor="start">Interface</text>
<text x="50" y="158" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="400" fill="#A0ADBC" text-anchor="start">Components / state</text>
<text x="50" y="191" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="400" fill="#A0ADBC" text-anchor="start">Interaction / feedback</text>
<path d="M308 166h34" stroke="#58A6FF" stroke-width="2" fill="none" />
<rect x="342" y="104" width="276" height="124" rx="10" fill="#161B22" stroke="#303D4D"/>
<text x="360" y="132" font-family="'Segoe UI', Arial, sans-serif" font-size="23" font-weight="600" fill="#E6EDF3" text-anchor="start">Application</text>
<text x="360" y="158" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="400" fill="#A0ADBC" text-anchor="start">API / authorization</text>
<text x="360" y="191" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="400" fill="#A0ADBC" text-anchor="start">Validation / business rules</text>
<path d="M618 166h34" stroke="#58A6FF" stroke-width="2" fill="none" />
<rect x="652" y="104" width="276" height="124" rx="10" fill="#161B22" stroke="#303D4D"/>
<text x="670" y="132" font-family="'Segoe UI', Arial, sans-serif" font-size="23" font-weight="600" fill="#E6EDF3" text-anchor="start">Work and data</text>
<text x="670" y="158" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="400" fill="#A0ADBC" text-anchor="start">Queues / cache</text>
<text x="670" y="191" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="400" fill="#A0ADBC" text-anchor="start">Schema / queries / storage</text>
<rect x="32" y="256" width="896" height="51" rx="10" fill="#1C2430" stroke="#303D4D"/>
<text x="50" y="288" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" fill="#58A6FF" text-anchor="start">Delivery supports every layer</text>
<text x="910" y="288" font-family="'JetBrains Mono', Consolas, monospace" font-size="18" font-weight="400" fill="#A0ADBC" text-anchor="end">Linux / containers / CI/CD</text>
