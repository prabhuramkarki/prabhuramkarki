<svg xmlns="http://www.w3.org/2000/svg" width="360" height="528" viewBox="0 0 360 528" role="img" aria-labelledby="title desc">
<title id="title">Illustrative full-stack architecture</title><desc id="desc">Interface, application logic, and work and data have explicit boundaries. Delivery supports all layers. This is a conceptual pattern, not every project’s architecture.</desc>
<rect x="0.5" y="0.5" width="359" height="527" rx="12" fill="#F6F8FA" stroke="#CBD5E1"/>
<text x="24" y="43" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#17283B" text-anchor="start">One feature. Clear boundaries.</text>
<text x="24" y="72" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start">An illustrative architecture</text>
<rect x="24" y="94" width="312" height="87" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
<text x="42" y="122" font-family="'Segoe UI', Arial, sans-serif" font-size="23" font-weight="600" fill="#17283B" text-anchor="start">Interface</text>
<text x="42" y="148" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start">Components / state</text>
<text x="42" y="171" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start">Interaction / feedback</text>
<path d="M180 181v18" stroke="#0969DA" stroke-width="2" fill="none" />
<rect x="24" y="199" width="312" height="87" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
<text x="42" y="227" font-family="'Segoe UI', Arial, sans-serif" font-size="23" font-weight="600" fill="#17283B" text-anchor="start">Application</text>
<text x="42" y="253" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start">API / authorization</text>
<text x="42" y="276" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start">Validation / business rules</text>
<path d="M180 286v18" stroke="#0969DA" stroke-width="2" fill="none" />
<rect x="24" y="304" width="312" height="87" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
<text x="42" y="332" font-family="'Segoe UI', Arial, sans-serif" font-size="23" font-weight="600" fill="#17283B" text-anchor="start">Work and data</text>
<text x="42" y="358" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start">Queues / cache</text>
<text x="42" y="381" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start">Schema / queries / storage</text>
<rect x="24" y="420" width="312" height="84" rx="10" fill="#EAF0F6" stroke="#CBD5E1"/>
<text x="42" y="448" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#0969DA" text-anchor="start">Delivery supports every layer</text>
<text x="42" y="477" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start">Linux / containers / CI/CD</text>
</svg>
